  Molmo2-8B:
    mode: "local"
    family: "molmo2"
    ckpt_path: "checkpoints/Molmo2-8B"
    torch_dtype: "bfloat16"
    device_map: "auto"
    trust_remote_code: true
    batch_size: 1

  # API model entries. Set OPENAI_API_KEY and/or GEMINI_API_KEY before running.
  gpt-5.5:
    mode: "api"
    provider: "openai"
    api_model_name: "gpt-5.5"
    api_url: "https://api.openai.com/v1/responses"
    api_key_env_var: "OPENAI_API_KEY"

  gemini-3.1-flash-lite-preview:
    mode: "api"
    provider: "gemini"
    api_model_name: "gemini-3.1-flash-lite-preview"
    api_url: "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.1-flash-lite-preview:generateContent"
    api_key_env_var: "GEMINI_API_KEY"
