model_registry:
  # Local model entries. Replace ckpt_path with your local checkpoint directories.
  # Release defaults use batch_size: 1 for stability. Increase after smoke tests pass.
  Qwen3-VL-4B-Instruct:
    mode: "local"
    family: "qwen3_vl"
    ckpt_path: "checkpoints/Qwen3-VL-4B-Instruct"
    torch_dtype: "bfloat16"
    device_map: "auto"
    batch_size: 1

  Qwen3-VL-8B-Instruct:
    mode: "local"
    family: "qwen3_vl"
    ckpt_path: "checkpoints/Qwen3-VL-8B-Instruct"
